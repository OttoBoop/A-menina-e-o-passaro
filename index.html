<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d2333">
<title>A Moça e o Pássaro</title>
<style>
:root{
  --cream:#ede6d6;
  --cream-dim:rgba(237,230,214,.62);
  --gold:#e0b153;
  --hairline:rgba(237,230,214,.16);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background-color:#1d2333;color:var(--cream);
  font-family:var(--serif);
  transition:background-color 1.4s ease;
}
#app{max-width:38rem;margin:0 auto;padding:1rem 1.25rem 3.5rem;min-height:100svh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.35rem 0 1.15rem}
.brand{font-family:var(--sans);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--cream-dim)}
#langBtn{
  font-family:var(--sans);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--cream);background:none;border:1px solid var(--hairline);border-radius:999px;
  padding:.42rem .9rem;cursor:pointer;transition:border-color .25s,color .25s;
}
#langBtn:hover,#langBtn:focus-visible{border-color:var(--gold);color:var(--gold)}
main{flex:1}
#stage{transition:opacity .38s ease,transform .38s ease}
#stage.out{opacity:0;transform:translateY(8px)}
.art{margin:0 0 1.45rem;border-radius:16px;overflow:hidden;border:1px solid rgba(0,0,0,.28)}
.art svg{display:block;width:100%;height:auto}
.prose p{margin:0 0 1.05em;font-size:1.13rem;line-height:1.8}
.prose p:last-child{margin-bottom:0}
.prose p.extra{color:var(--cream-dim);font-style:italic}
.choices{margin-top:1.7rem;display:grid;gap:.65rem}
.choice{
  font-family:var(--serif);font-size:1.04rem;line-height:1.5;text-align:left;color:var(--cream);
  background:rgba(255,255,255,.028);border:1px solid var(--hairline);border-radius:12px;
  padding:.95rem 1.15rem;cursor:pointer;
  transition:border-color .25s,background-color .25s,color .25s;
}
.choice:hover,.choice:focus-visible{border-color:var(--gold);color:var(--gold);background:rgba(224,177,83,.06)}
.choice:focus-visible,#langBtn:focus-visible,.begin:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.badge{font-family:var(--sans);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;margin:0 0 .45rem}
.badge.good{color:#93d0ae}
.badge.bitter{color:#e2c178}
.badge.tragic{color:#df97a0}
.ending-title{font-size:1.75rem;font-weight:500;font-style:italic;line-height:1.25;margin:0 0 1.1rem}
.dots{
  display:flex;align-items:center;gap:.5rem;margin-top:2.1rem;
  font-family:var(--sans);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cream-dim);
}
.dot{width:9px;height:9px;border-radius:50%;border:1px solid var(--cream-dim);display:inline-block}
.dot.on.good{background:#93d0ae;border-color:#93d0ae}
.dot.on.bitter{background:#e2c178;border-color:#e2c178}
.dot.on.tragic{background:#df97a0;border-color:#df97a0}
.dots span:last-child{margin-left:.35rem}
.title-screen{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:9svh}
.title-bird{margin-bottom:1.7rem}
.title-bird svg{display:block}
.eyebrow{font-family:var(--sans);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:0 0 .95rem}
h1{font-size:clamp(2.1rem,8.5vw,3.1rem);font-weight:500;line-height:1.12;margin:0 0 .9rem}
.subtitle{font-style:italic;color:var(--cream-dim);font-size:1.08rem;margin:0 0 2.5rem}
.begin{
  font-family:var(--serif);font-size:1.05rem;color:#221a0d;background:var(--gold);
  border:none;border-radius:999px;padding:.85rem 2.5rem;cursor:pointer;transition:filter .2s;
}
.begin:hover{filter:brightness(1.08)}
@media (prefers-reduced-motion:no-preference){
  .title-bird svg{animation:bob 3.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
}
@media (prefers-reduced-motion:reduce){
  body,#stage,.choice,#langBtn{transition:none}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand" id="brand"></span>
    <button id="langBtn" aria-label="Mudar idioma / Switch language">EN</button>
  </header>
  <main><div id="stage" aria-live="polite"></div></main>
</div>
<script>
/*STORY-START*/
const STORY = {
  ui: {

    title:    { pt: "A Moça e o Pássaro", en: "The Girl and the Bird" },
    eyebrow:  { pt: "uma fábula breve · três finais", en: "a short fable · three endings" },
    subtitle: { pt: "Sobre amar o que tem asas.", en: "On loving what has wings." },
    begin:    { pt: "Começar", en: "Begin" },
    back:     { pt: "— Voltar à última escolha", en: "— Return to the last choice" },
    restart:  { pt: "↺ Recomeçar do início", en: "↺ Start over" },
    foundLabel: { pt: "finais encontrados", en: "endings found" },
    varLabel:   { pt: "variações do agridoce", en: "bittersweet variations" }
  },
  scenes: {

    storm: {
      sky: "#20262f", art: "storm",
      text: [
        { pt: "Ela o encontrou depois da tempestade: uma coisinha escura tremendo debaixo da mangueira, leve demais até para ter medo. Cabia inteiro numa mão fechada.",
          en: "She found him after the storm: a small dark thing shivering under the mango tree, too light even to be afraid. He fit whole inside one closed hand." },
        { pt: "Ela decidiu, sem bem decidir, que ele era dela.",
          en: "She decided, without quite deciding, that he was hers." }
      ],
      choices: [
        { label: { pt: "— Dar um nome a ele", en: "— Give him a name" }, to: "care", set: "named" },
        { label: { pt: "— Não dar nome. Nomear é começar a perder", en: "— No name. To name is to begin to lose" }, to: "care" }
      ]
    },

    care: {
      sky: "#2a2638", art: "care",
      text: [
        { if: "named",
          pt: "Ela o chamou de Aurélio, pelo dourado que já se anunciava na ponta das asas. Quando aprendeu a cantar, ele cantava o próprio nome em três notas — sempre as mesmas três.",
          en: "She called him Aurélio, for the gold already showing at the tips of his wings. When he learned to sing, he sang his own name in three notes — always the same three." },
        { if: "!named",
          pt: "Ela não lhe deu nome; nomear, pensava, é como a perda começa. Chamava-o apenas de ele, e a casa inteira sabia de quem se falava.",
          en: "She gave him no name; naming, she thought, is how losing begins. She called him only him, and the whole house knew who was meant." },
        { pt: "Ele sarou depressa e cresceu bonito de doer. Faltava decidir uma coisa pequena, dessas que parecem não decidir nada: como alimentá-lo.",
          en: "He healed quickly and grew beautiful enough to hurt. One small thing remained to be decided — the kind that seems to decide nothing: how to feed him." }
      ],
      choices: [
        { label: { pt: "— Na palma da mão, todas as manhãs", en: "— From the palm of her hand, every morning" }, to: "w1", set: "hand" },
        { label: { pt: "— Espalhar sementes no parapeito, para ele aprender a procurar", en: "— Scatter seeds on the windowsill, so he learns to search" }, to: "w1" }
      ]
    },

    w1: {
      sky: "#25303d", art: "fledge",
      text: [
        { pt: "Numa manhã de vento, ele atravessou a sala voando pela primeira vez — desajeitado, glorioso — e pousou na beirada da janela aberta.",
          en: "On a windy morning he flew across the room for the first time — clumsy, glorious — and landed on the edge of the open window." },
        { pt: "Não fez menção de ir. Só ficou ali, olhando o céu como quem lê uma carta antiga.",
          en: "He made no move to leave. He just stayed there, looking at the sky the way one reads an old letter." }
      ],
      choices: [
        { label: { pt: "— Chamá-lo de volta para dentro", en: "— Call him back inside" }, to: "tempest", grip: 1 },
        { label: { pt: "— Deixar que ele olhe", en: "— Let him look" }, to: "tempest" }
      ]
    },

    tempest: {
      sky: "#1e1b2a", art: "tempest",
      text: [
        { pt: "Semanas depois, uma tempestade chegou de noite, parecida com aquela que o trouxe. O vento batia a janela contra o batente; a chuva entrava um palmo.",
          en: "Weeks later a storm came in the night, much like the one that had brought him. The wind knocked the window against its frame; the rain came in a hand's width." },
        { pt: "Do poleiro, ele olhava a escuridão lá fora sem nenhum medo — e isso, ela percebeu, foi o que a assustou.",
          en: "From his perch he watched the dark outside without any fear — and that, she realized, was what frightened her." }
      ],
      choices: [
        { label: { pt: "— Fechar a janela. Só esta noite", en: "— Close the window. Just for tonight" }, to: "cat", grip: 1, set: "stormClosed" },
        { label: { pt: "— Deixar aberta, como todas as noites", en: "— Leave it open, like every night" }, to: "cat" }
      ]
    },

    cat: {
      sky: "#2b3240", art: "cat",
      text: [
        { pt: "No sábado, um gato apareceu no muro. Ficou uma tarde inteira olhando a janela, paciente como uma dívida.",
          en: "On Saturday a cat appeared on the wall. It spent a whole afternoon watching the window, patient as a debt." },
        { pt: "A vizinha riu do portão: 'Esse aí, quando aprender a voar direito, some. Passarinho bonito não fica.'",
          en: "The neighbor laughed from the gate: 'That one, once he learns to fly properly, is gone. Pretty birds don't stay.'" }
      ],
      choices: [
        { label: { pt: "— Não deixá-lo mais sozinho na janela", en: "— Never leave him alone at the window again" }, to: "window", grip: 1 },
        { label: { pt: "— Deixar o dia seguir", en: "— Let the day go on" }, to: "window" }
      ]
    },

    window: {
      sky: "#25303d", art: "fledge", fork: true,
      text: [
        { if: "grip>=2",
          pt: "O medo, àquela altura, já tinha endereço: morava no armário, dentro de uma gaiola comprada 'só por garantia' na semana do gato. Ela nem se lembrava de ter decidido comprá-la.",
          en: "By then, fear had an address: it lived in the closet, inside a cage bought 'just in case' the week of the cat. She didn't even remember deciding to buy it." },
        { pt: "Naquela manhã, ele abriu as asas na beirada da janela e ficou — um segundo a mais do que de costume. O céu inteiro do lado de fora; o coração dela se fechando feito um punho.",
          en: "That morning he opened his wings on the edge of the window and stayed — one second longer than usual. The whole sky outside; her heart closing like a fist." },
        { if: "grip<=1",
          pt: "A ideia da gaiola passou por ela como um cheiro estranho: chegou, incomodou, não era dela.",
          en: "The idea of a cage passed through her like a strange smell: it arrived, it bothered her, it wasn't hers." }
      ],
      choices: [
        { label: { pt: "— Trazer a gaiola, só por um tempo", en: "— Bring the cage, just for a while" }, to: "cage" },
        { label: { pt: "— Não fazer nada. Confiar", en: "— Do nothing. Trust" }, to: "sky" }
      ]
    },

    sky: {
      sky: "#1f3850", art: "sky",
      text: [
        { pt: "Ela não fez nada — que é o jeito mais difícil de fazer alguma coisa. Por três dias ele foi e voltou, cada vez mais longe, cada vez mais alto, até que numa tarde o céu o engoliu por inteiro.",
          en: "She did nothing — which is the hardest way of doing something. For three days he went and came back, each time farther, each time higher, until one afternoon the sky swallowed him whole." },
        { pt: "A casa ficou do tamanho do silêncio.",
          en: "The house shrank to the size of its silence." }
      ],
      choices: [
        { label: { pt: "— Esperar", en: "— Wait" }, to: "vigil" }
      ]
    },

    vigil: {
      sky: "#1b2030", art: "vigil", fork: true,
      text: [
        { pt: "Três manhãs de fruta intocada na beirada. A vizinha já a olhava com pena, que é a pior das visitas.",
          en: "Three mornings of untouched fruit on the sill. The neighbor was already looking at her with pity, which is the worst kind of visit." },
        { pt: "Na quarta noite, a mão dela ficou um tempo demais no trinco da janela.",
          en: "On the fourth night, her hand stayed a moment too long on the window latch." }
      ],
      choices: [
        { label: { pt: "— Fechar a janela. Chega", en: "— Close the window. Enough" }, to: "conf_window" },
        { label: { pt: "— Esperar mais uma manhã", en: "— Wait one more morning" }, to: "conf_good" }
      ]
    },

    conf_good: {
      sky: "#1b2030", art: "vigil",
      text: [
        { pt: "Antes do sol, três notas conhecidas atravessaram o quarto. Ela manteve os olhos fechados mais um instante — não para duvidar, mas para se perguntar, pela última vez, por que tinha deixado a janela aberta esse tempo todo.",
          en: "Before the sun, three familiar notes crossed the room. She kept her eyes closed one more moment — not to doubt, but to ask herself, one last time, why she had kept the window open all this time." }
      ],
      choices: [
        { label: { pt: "— Porque amar é abrir a mão", en: "— Because to love is to open your hand" }, to: "end_good", motive: "grace" },
        { label: { pt: "— Porque, no fundo, eu sempre soube", en: "— Because, deep down, I always knew" }, to: "end_good", motive: "faith" }
      ]
    },

    end_good: {
      sky: "#3d3022", art: "good",
      ending: { cls: "good", badge: { pt: "final feliz", en: "good ending" }, title: { pt: "O céu aberto", en: "The open sky" } },
      text: [
        { pt: "Ele estava na janela — maior, mais dourado, com o céu inteiro dobrado dentro das asas. Comeu da fruta, cantou para ela e partiu de novo. E voltou. A vida inteira foi assim: ele partindo, ele voltando, livre nas duas direções.",
          en: "He was at the window — bigger, more golden, the whole sky folded into his wings. He ate the fruit, sang to her, and left again. And returned. Their whole life was like that: him leaving, him returning, free in both directions." },
        { pt: "Ela entendeu que ele sempre tinha sido dela — mas do jeito que o céu é: de quem olha para cima.",
          en: "She understood that he had always been hers — but the way the sky is: it belongs to whoever looks up." },
        { if: "named", em: true,
          pt: "E toda vez que ele chegava, ela dizia o nome dele — e ele respondia: três notas, sempre as mesmas três.",
          en: "And every time he arrived she said his name — and he answered: three notes, always the same three." },
        { if: "!named", em: true,
          pt: "Ela nunca lhe deu um nome. Nunca foi preciso.",
          en: "She never gave him a name. It was never needed." },
        { if: "grip==0", em: true,
          pt: "E naquele verão — isso ela não contou a ninguém, para não gastar — ele fez ninho na mangueira do quintal, a mesma que um dia o derrubou. Ela passou a acordar com filhotes ensaiando voos curtos entre os galhos.",
          en: "And that summer — this she told no one, so as not to spend it — he built a nest in the mango tree in the yard, the same one that had once dropped him. She began to wake to fledglings rehearsing short flights between the branches." },
        { if: "motive==grace", em: true,
          pt: "Amar é abrir a mão. Na palma aberta, sempre coube mais céu.",
          en: "To love is to open your hand. An open palm always held more sky." },
        { if: "motive==faith", em: true,
          pt: "No fundo, ela sempre soube. Saber não tinha tirado o medo — só tinha ensinado onde guardá-lo.",
          en: "Deep down, she always knew. Knowing had not taken the fear away — it had only taught her where to keep it." }
      ]
    },

    conf_window: {
      sky: "#20242e", art: "vigil",
      text: [
        { pt: "O trinco era pequeno e fez um barulho pequeno. Pronto. Ela ficou um instante diante do próprio reflexo no vidro, procurando o motivo.",
          en: "The latch was small and made a small sound. Done. She stood a moment before her own reflection in the glass, searching for the reason." }
      ],
      choices: [
        { label: { pt: "— Ele não ia voltar mesmo", en: "— He wasn't coming back anyway" }, to: "end_window", motive: "denial" },
        { label: { pt: "— Eu só não aguentava mais esperar", en: "— I just couldn't bear the waiting anymore" }, to: "end_window", motive: "exhaust" }
      ]
    },

    end_window: {
      sky: "#2a3140", art: "window_closed",
      ending: { cls: "bitter", badge: { pt: "final agridoce", en: "bittersweet ending" }, title: { pt: "A janela fechada", en: "The closed window" } },
      text: [
        { pt: "Ele voltou na manhã seguinte.",
          en: "He came back the next morning." },
        { pt: "Deu duas voltas diante do vidro, devagar, como quem confere o endereço. Pousou na beirada de fora, cantou uma vez para a janela fechada — e o céu o levou de volta, dessa vez sem pressa nenhuma.",

          pt: "Fechar, afinal, ela já tinha treinado uma vez — naquela noite de tempestade. Só uma noite, ela disse. As janelas aprendem rápido.",
          en: "Closing it, after all, she had already practiced once — on the night of the storm. Just one night, she had said. Windows learn fast." },
        { if: "motive==denial", em: true,
          pt: "Ele não ia voltar mesmo, ela repetiu por anos. Repetir nunca tornou verdade.",
          en: "He wasn't coming back anyway, she repeated for years. Repeating never made it true." },
        { if: "motive==exhaust", em: true,
          pt: "Esperar doía. Ela trocou a dor pela culpa achando que era um bom negócio.",
          en: "Waiting hurt. She traded the pain for guilt, believing it a fair trade." }
      ]
    },

    cage: {
      sky: "#272029", art: "cage", fork: true,
      text: [
        { if: "grip>=2",
          pt: "A gaiola saiu do armário onde esperava desde a semana do gato. Era a mais bonita da loja: arames dourados, poleiro de jacarandá. 'Só por um tempo', ela disse, e a frase coube com folga na porta aberta.",
          en: "The cage came out of the closet where it had waited since the week of the cat. It was the prettiest in the shop: golden wire, a rosewood perch. 'Just for a while,' she said, and the phrase fit easily through the open door." },
        { if: "grip<=1",
          pt: "A gaiola chegou da loja no dia seguinte, a mais bonita que havia: arames dourados, poleiro de jacarandá. 'Só por um tempo', ela disse, e a frase coube com folga na porta aberta.",
          en: "The cage arrived from the shop the next day, the prettiest they had: golden wire, a rosewood perch. 'Just for a while,' she said, and the phrase fit easily through the open door." },
        { if: "stormClosed", em: true,
          pt: "Era o mesmo tom de voz da noite da tempestade. Só esta noite, ela tinha dito. As pequenas frases é que carregam as grandes portas.",
          en: "It was the same tone of voice as the night of the storm. Just for tonight, she had said. It's the small phrases that carry the big doors." },
        { pt: "Dentro, ele tinha o melhor de tudo — menos o resto. O canto foi afinando até virar um fio. De madrugada, ela acordava com o som das asas batendo nos arames: um relógio descompassado, marcando uma hora que não chegava nunca.",
          en: "Inside, he had the best of everything — except the rest. His song thinned until it was a thread. At dawn she would wake to the sound of wings against wire: an arrhythmic clock, striking an hour that never came." }
      ],
      choices: [
        { label: { pt: "— Abrir a porta da gaiola", en: "— Open the cage door" }, to: "conf_door" },
        { label: { pt: "— Manter. Só mais um tempo", en: "— Keep it. Just a while longer" }, to: "escape" },
        { label: { pt: "— Abrir a gaveta da tesoura", en: "— Open the scissors drawer" }, to: "scissors" }
      ]
    },

    conf_door: {
      sky: "#272029", art: "cage",
      text: [
        { pt: "A mão dela parou no trinco da gaiola. Trincos, ela ia aprendendo, são o lugar onde a gente se decide.",
          en: "Her hand stopped on the cage latch. Latches, she was learning, are where people decide who they are." }
      ],
      choices: [
        { label: { pt: "— Porque eu o amo", en: "— Because I love him" }, to: "end_door", motive: "love" },
        { label: { pt: "— Porque não suporto mais o som das asas", en: "— Because I can't bear the sound of his wings anymore" }, to: "end_door", motive: "relief" }
      ]
    },

    end_door: {
      sky: "#24313a", art: "neutral",
      ending: { cls: "bitter", badge: { pt: "final agridoce", en: "bittersweet ending" }, title: { pt: "A porta aberta", en: "The open door" } },
      text: [
        { pt: "Ela queria que fosse um presente; ele entendeu como uma trégua.",
          en: "She meant it as a gift; he took it as a truce." },
        { pt: "Passou por ela como uma pedra dourada atirada ao contrário — sem dar uma volta sobre a casa, sem olhar para trás. O céu o recebeu como se nada tivesse acontecido.",
          en: "He shot past her like a golden stone thrown in reverse — no circle over the house, no look back. The sky received him as if nothing had ever happened." },
        { pt: "Ela deixou a janela aberta pelo resto da vida. Ele nunca voltou — mas em algum lugar, ela sabia, ele estava voando.",
          en: "She left the window open for the rest of her life. He never came back — but somewhere, she knew, he was flying." },
        { if: "hand", em: true,
          pt: "Por anos, o pior pensamento chegava na hora do café: ele nunca tinha procurado o próprio alimento. Fora ela quem escolhera assim — uma palma aberta de cada vez.",
          en: "For years the worst thought arrived with morning coffee: he had never once searched for his own food. She had chosen it that way — one open palm at a time." },
        { if: "!hand", em: true,
          pt: "Restava um consolo do tamanho de uma semente: ele sabia se virar. Tinha sido ela mesma que ensinara, num parapeito, sem saber para quê.",
          en: "One consolation remained, the size of a seed: he knew how to fend for himself. She herself had taught him, on a windowsill, not knowing what for." },
        { if: "named", em: true,
          pt: "Durante anos, a quaisquer três notas vindas da rua, ela virava a cabeça. Nunca era ele.",
          en: "For years, at any three notes from the street, she turned her head. It was never him." },

const stage = document.getElementById("stage");
const brand = document.getElementById("brand");
const langBtn = document.getElementById("langBtn");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

const FRESH = () => ({ named: false, hand: false, stormClosed: false, grip: 0, motive: null });
let lang = "pt";
let view = { kind: "title" };
let state = FRESH();
let lastFork = "window";
const foundIds = new Set();
const BITTER_IDS = ["end_window", "end_door", "end_escape"];

const t = (o) => o[lang];

function cond(x) {
  if (!x) return true;
  if (x[0] === "!") return !state[x.slice(1)];
  let m;
  if ((m = x.match(/^grip(>=|<=|==)(\d+)$/))) {
    const v = state.grip, n = +m[2];
    return m[1] === ">=" ? v >= n : m[1] === "<=" ? v <= n : v === n;
  }
  if ((m = x.match(/^motive==(\w+)$/))) return state.motive === m[1];
  return !!state[x];
}

function swap(html, sky) {
  document.body.style.backgroundColor = sky;
  const apply = () => { stage.innerHTML = html; };
  if (reduceMotion.matches) { apply(); window.scrollTo(0, 0); return; }
  stage.classList.add("out");
  setTimeout(() => {
    apply();
    stage.classList.remove("out");
    window.scrollTo({ top: 0 });
  }, 390);
}

function dotsHtml() {
  const cats = [["good", "good"], ["bitter", "bitter"], ["tragic", "tragic"]];
  const has = (cls) => [...foundIds].some(id => STORY.scenes[id].ending.cls === cls);
  const catCount = cats.filter(c => has(c[0])).length;
  const bitterCount = BITTER_IDS.filter(id => foundIds.has(id)).length;
  let h = '<div class="dots">'
    + cats.map(c => '<span class="dot ' + (has(c[0]) ? "on " : "") + c[1] + '"></span>').join("")
    + "<span>" + t(STORY.ui.foundLabel) + " · " + catCount + "/3</span></div>";
  if (bitterCount > 0) {
    h += '<div class="dots" style="margin-top:.55rem">'
      + BITTER_IDS.map(id => '<span class="dot ' + (foundIds.has(id) ? "on " : "") + 'bitter"></span>').join("")
      + "<span>" + t(STORY.ui.varLabel) + " · " + bitterCount + "/3</span></div>";
  }
  return h;
}

function renderTitle() {
  view = { kind: "title" };
  const h = '<div class="title-screen">'
    + '<div class="title-bird" aria-hidden="true">' + ART.titlebird + "</div>"
    + '<p class="eyebrow">' + t(STORY.ui.eyebrow) + "</p>"
    + "<h1>" + t(STORY.ui.title) + "</h1>"
    + '<p class="subtitle">' + t(STORY.ui.subtitle) + "</p>"
    + '<button class="begin" data-act="begin">' + t(STORY.ui.begin) + "</button>"
    + "</div>";
  swap(h, "#1d2333");
}

function renderScene(id) {
  const sc = STORY.scenes[id];
  view = { kind: "scene", id: id };
  if (sc.fork) lastFork = id;
  if (sc.ending) foundIds.add(id);

  let h = '<figure class="art" aria-hidden="true">' + ART[sc.art] + "</figure>";
  if (sc.ending) {
    h += '<p class="badge ' + sc.ending.cls + '">' + t(sc.ending.badge) + "</p>";
    h += '<h2 class="ending-title">' + t(sc.ending.title) + "</h2>";
  }
  h += '<div class="prose">'
    + sc.text.filter(b => cond(b.if)).map(b => "<p" + (b.em ? ' class="extra"' : "") + ">" + t(b) + "</p>").join("")
    + "</div>";

  if (sc.choices) {
    h += '<div class="choices">'
      + sc.choices.map((c, i) => '<button class="choice" data-act="go" data-i="' + i + '">' + t(c.label) + "</button>").join("")
      + "</div>";
  }
  if (sc.ending) {
    h += dotsHtml();
    h += '<div class="choices">'
      + '<button class="choice" data-act="back">' + t(STORY.ui.back) + "</button>"
      + '<button class="choice" data-act="restart">' + t(STORY.ui.restart) + "</button>"
      + "</div>";
  }
  swap(h, sc.sky);
}

stage.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "begin" || act === "restart") {
    state = FRESH();
    lastFork = "window";
    renderScene("storm");
  } else if (act === "go") {
    const sc = STORY.scenes[view.id];
    const c = sc.choices[+b.dataset.i];
    if (c.set) state[c.set] = true;
    if (c.grip) state.grip += c.grip;
    if (c.motive) state.motive = c.motive;
    renderScene(c.to);
  } else if (act === "back") {
    state.motive = null;
    renderScene(lastFork);
  }
});

langBtn.addEventListener("click", () => {
  lang = lang === "pt" ? "en" : "pt";
  langBtn.textContent = lang === "pt" ? "EN" : "PT";
  document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
  document.title = t(STORY.ui.title);
  brand.textContent = t(STORY.ui.brand);
  if (view.kind === "title") renderTitle(); else renderScene(view.id);
});

brand.textContent = t(STORY.ui.brand);
renderTitle();
</script>
